<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kidney Food Log">
  <rect width="512" height="512" rx="96" fill="#1a5fb4"/>
  <!-- Notebook page: this app is a logbook, deliberately not a medical device. -->
  <rect x="136" y="104" width="240" height="304" rx="24" fill="#ffffff"/>
  <rect x="176" y="164" width="160" height="18" rx="9" fill="#c9d1dc"/>
  <rect x="176" y="212" width="120" height="18" rx="9" fill="#c9d1dc"/>
  <rect x="176" y="260" width="160" height="18" rx="9" fill="#c9d1dc"/>
  <rect x="176" y="308" width="96" height="18" rx="9" fill="#c9d1dc"/>
  <!-- The question mark is the product thesis: we show what is NOT known. -->
  <circle cx="352" cy="336" r="72" fill="#6b3fa0" stroke="#ffffff" stroke-width="16"/>
  <text x="352" y="372" font-family="system-ui, sans-serif" font-size="96"
        font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
</svg>
